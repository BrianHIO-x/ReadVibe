name: Flutter checks

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
      - name: Create ephemeral CI release key
        run: |
          keytool -genkeypair -v -keystore android/ci-release.jks -storepass readvibe-ci -keypass readvibe-ci -alias readvibe-ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=ReadVibe CI"
          printf '%s\n' 'storeFile=ci-release.jks' 'storePassword=readvibe-ci' 'keyAlias=readvibe-ci' 'keyPassword=readvibe-ci' > android/key.properties
      - name: Build Android arm64 release smoke APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --build-name 0.6.12 --build-number 58 --no-pub
